# Spot-first node pool dedicated to Jenkins agent pods. Scales to zero when idle.
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: ci-agents
spec:
  template:
    metadata:
      labels:
        workload: ci
    spec:
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: ci-agents
      taints:
        - key: dedicated
          value: ci
          effect: NoSchedule
      requirements:
        - { key: karpenter.sh/capacity-type, operator: In, values: ["spot", "on-demand"] }
        - { key: kubernetes.io/arch, operator: In, values: ["amd64"] }
        - { key: karpenter.k8s.aws/instance-category, operator: In, values: ["c", "m"] }
        - { key: karpenter.k8s.aws/instance-generation, operator: Gt, values: ["5"] }
      expireAfter: 24h                    # recycle nodes daily (patching, no drift)
  disruption:
    consolidationPolicy: WhenEmpty        # never evict running builds to consolidate
    consolidateAfter: 5m
  limits:
    cpu: "400"
    memory: 1600Gi
---
apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: ci-agents
spec:
  role: KarpenterNodeRole-platform-ci
  amiSelectorTerms:
    - alias: bottlerocket@latest
  subnetSelectorTerms:
    - tags: { karpenter.sh/discovery: platform-ci }
  securityGroupSelectorTerms:
    - tags: { karpenter.sh/discovery: platform-ci }
  blockDeviceMappings:
    - deviceName: /dev/xvdb
      ebs: { volumeSize: 100Gi, volumeType: gp3, encrypted: true }
