# AWS Secrets Manager → K8s Secret `jenkins-casc-secrets` → env vars → JCasC ${VAR}
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: aws-sm
  namespace: jenkins
spec:
  provider:
    aws:
      service: SecretsManager
      region: eu-west-1
      auth:
        jwt:
          serviceAccountRef:
            name: jenkins                # IRSA role allows secretsmanager:GetSecretValue on ci/jenkins/*
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: jenkins-casc-secrets
  namespace: jenkins
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: aws-sm
  target:
    name: jenkins-casc-secrets
    creationPolicy: Owner
  data:
    - { secretKey: OIDC_CLIENT_SECRET,     remoteRef: { key: ci/jenkins/oidc,       property: client_secret } }
    - { secretKey: GITHUB_APP_ID,          remoteRef: { key: ci/jenkins/github-app, property: app_id } }
    - { secretKey: GITHUB_APP_PRIVATE_KEY, remoteRef: { key: ci/jenkins/github-app, property: private_key_pkcs8 } }
    - { secretKey: SONAR_TOKEN,            remoteRef: { key: ci/jenkins/sonar,      property: token } }
    - { secretKey: SLACK_TOKEN,            remoteRef: { key: ci/jenkins/slack,      property: token } }
    - { secretKey: NVD_API_KEY,            remoteRef: { key: ci/jenkins/nvd,        property: api_key } }
---
# Team-scoped credential via kubernetes-credentials-provider: appears in Jenkins as id "gitops-deploy-key"
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: gitops-deploy-key
  namespace: jenkins
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: SecretStore, name: aws-sm }
  target:
    name: gitops-deploy-key
    template:
      metadata:
        labels:
          jenkins.io/credentials-type: basicSSHUserPrivateKey
        annotations:
          jenkins.io/credentials-description: "Deploy key: push to acme/gitops"
      data:
        username: git
        privateKey: "{{ .key }}"
  data:
    - { secretKey: key, remoteRef: { key: ci/jenkins/gitops-deploy-key, property: private_key } }
