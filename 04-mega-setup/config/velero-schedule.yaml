# Hourly snapshot of the jenkins namespace (PV + objects), kept 7 days; daily kept 30 days.
apiVersion: velero.io/v1
kind: Schedule
metadata:
  name: jenkins-hourly
  namespace: velero
spec:
  schedule: "0 * * * *"
  template:
    includedNamespaces: [jenkins]
    snapshotVolumes: true
    ttl: 168h
---
apiVersion: velero.io/v1
kind: Schedule
metadata:
  name: jenkins-daily
  namespace: velero
spec:
  schedule: "30 2 * * *"
  template:
    includedNamespaces: [jenkins]
    snapshotVolumes: true
    ttl: 720h
